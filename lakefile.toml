name = "hex-mv-poly"
defaultTargets = ["HexMvPoly"]

leanOptions = [
  { name = "doc.verso", value = true },
  { name = "doc.verso.suggestions", value = false },
]

[[require]]
name = "HexBasic"
git = "https://github.com/leanprover/hex-basic.git"
rev = "591c146eeee0ef301a110cd33c19cc0cf1e07352"

[[require]]
name = "HexPoly"
git = "https://github.com/leanprover/hex-poly.git"
rev = "1ca97f372946ecc430fe4f3961ec4220f9bc7706"

[[lean_lib]]
name = "HexMvPoly"
globs = [
  "HexMvPoly",
  "HexMvPoly.Mono",
  "HexMvPoly.Basic",
  "HexMvPoly.Operations",
  "HexMvPoly.Query",
  "HexMvPoly.Eval",
  "HexMvPoly.Structural",
  "HexMvPoly.Recursive",
]

[[lean_lib]]
name = "HexMvPolyTests"
globs = ["HexMvPoly.KernelTests"]
