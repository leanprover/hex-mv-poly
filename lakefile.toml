name = "hex-mv-poly"
defaultTargets = ["HexMvPoly"]

leanOptions = [
  { name = "doc.verso", value = true },
  { name = "doc.verso.suggestions", value = false },
]

[[require]]
name = "HexBasic"
git = "https://github.com/leanprover/hex-basic.git"
rev = "v0.7.0"

[[require]]
name = "HexPoly"
git = "https://github.com/leanprover/hex-poly.git"
rev = "v0.7.0"

[[require]]
name = "HexModArith"
git = "https://github.com/leanprover/hex-mod-arith.git"
rev = "v0.7.0"

[[lean_lib]]
name = "HexMvPoly"

[[lean_lib]]
name = "HexMvPolyTests"
globs = ["HexMvPoly.KernelTests", "HexMvPoly.KernelResidueTests"]
