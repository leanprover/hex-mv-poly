name = "hex-mv-poly"
defaultTargets = ["HexMvPoly"]

leanOptions = [
  { name = "doc.verso", value = true },
  { name = "doc.verso.suggestions", value = false },
]

[[require]]
name = "HexBasic"
git = "https://github.com/leanprover/hex-basic.git"
rev = "a47240943e925951a676d1a1c2f2a615ae68fdef"

[[require]]
name = "HexPoly"
git = "https://github.com/leanprover/hex-poly.git"
rev = "1f7f31c7733ee5f0fa30d4a376adfa5125895c29"

[[lean_lib]]
name = "HexMvPoly"
globs = [
  "HexMvPoly",
  "HexMvPoly.Mono",
  "HexMvPoly.Basic",
  "HexMvPoly.Operations",
  "HexMvPoly.Query",
  "HexMvPoly.Eval",
  "HexMvPoly.Structural",
  "HexMvPoly.Recursive",
]

[[lean_lib]]
name = "HexMvPolyTests"
globs = ["HexMvPoly.KernelTests"]
