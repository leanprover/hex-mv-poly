name = "hex-mv-poly-conformance"
defaultTargets = ["HexMvPolyConformance"]

leanOptions = [
  { name = "doc.verso", value = true },
  { name = "doc.verso.suggestions", value = false },
]

[[require]]
name = "HexMvPoly"
path = ".."

[[require]]
name = "hex-test-kit"
git = "https://github.com/leanprover/hex-test-kit.git"
rev = "5b3dc5d7789cb680d64f8f4046254f93b7424e4f"

[[lean_lib]]
name = "HexMvPolyConformance"
globs = [
  "HexMvPolyFixtures",
  "HexMvPoly.Conformance",
]

[[lean_exe]]
name = "hexmvpoly_emit_fixtures"
root = "HexMvPoly.EmitFixtures"
