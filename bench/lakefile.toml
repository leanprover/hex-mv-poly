name = "hex-mv-poly-bench"
defaultTargets = ["hexmvpoly_bench"]

leanOptions = [
  { name = "doc.verso", value = true },
  { name = "doc.verso.suggestions", value = false },
]

[[require]]
name = "HexMvPoly"
path = ".."

[[require]]
name = "lean-bench"
git = "https://github.com/kim-em/lean-bench.git"
rev = "master"

[[lean_lib]]
name = "HexMvPolyBenchSupport"
globs = ["HexMvPolyCorpus"]

[[lean_exe]]
name = "hexmvpoly_bench"
root = "HexMvPoly.Bench"
